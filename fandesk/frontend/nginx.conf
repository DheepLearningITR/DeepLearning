server {
    listen 80;
    root /usr/share/nginx/html;

    # The live event stream: no buffering, no compression, long reads.
    location = /api/ask {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    # Client-side routes (/history) fall back to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
