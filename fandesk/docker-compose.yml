services:
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    depends_on:
      - api

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_URL: http://localhost:6006
    volumes:
      - app-data:/data
    depends_on:
      - phoenix

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix-data:/mnt/data

volumes:
  app-data:
  phoenix-data:
